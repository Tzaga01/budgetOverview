name: Budget Overview

on:
  push:
    branches: [ master ]
jobs:
  test:
    runs-on: ubuntu-latest
    container: node:14.17.6-alpine3.14
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v2
        with:
          node-version: '14'
      - run: npm ci
      - run: npm test
      - run: npm run build